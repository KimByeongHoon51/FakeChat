<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FakeChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141517;
    --panel: #1c1d21;
    --line: #2a2c31;
    --text: #e8e8ea;
    --muted: #8a8d95;
    --accent: #00ffa3;
    --donate1: #3b2a6b;
    --donate2: #251c45;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* 모든 크기는 rem 기준. 창이 420x820일 때 16px이고, 창이 작아지면 글자·버튼·여백이 같은 비율로 줄어든다 */
  html {
    height: 100%;
    font-size: clamp(8px, min(100vw / 26.25, 100vh / 51.25), 18px);
  }
  body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #app { height: 100%; display: flex; flex-direction: column; }
  #away {
    display: none; height: 100%; flex-direction: column; align-items: center; justify-content: center;
    gap: 1rem; color: var(--muted); font-size: 0.9375rem; text-align: center; padding: 1rem;
  }
  #away.show { display: flex; }
  #away button {
    padding: 0.625rem 1.25rem; border-radius: 0.5rem; border: none; cursor: pointer;
    background: var(--accent); color: #0d0d0f; font: inherit; font-weight: 700;
  }

  /* 상단 바 */
  header {
    display: flex; align-items: center; gap: 0.625rem;
    padding: 0.625rem 0.875rem;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .live {
    background: #ff3b47; color: #fff; font-weight: 900; font-size: 0.6875rem;
    padding: 0.125rem 0.375rem; border-radius: 0.25rem; letter-spacing: .5px;
  }
  .title { font-weight: 700; font-size: 0.9375rem; }
  .viewers { color: #ff5a64; font-size: 0.8125rem; font-weight: 700; margin-left: auto; }
  .viewers::before { content: "● "; font-size: 0.625rem; }
  .icon-btn {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 1.125rem; padding: 0.125rem 0.25rem; line-height: 1;
  }
  .icon-btn:hover { color: var(--text); }
  #pin { display: none; filter: grayscale(1); opacity: .5; font-size: 0.9375rem; }
  .desktop #pin, .can-pip #pin { display: inline-block; }
  #pin.on { filter: none; opacity: 1; }
  .end-btn {
    background: none; border: 1px solid #ff5a64; color: #ff5a64; cursor: pointer; border-radius: 0.375rem;
    font: inherit; font-size: 0.6875rem; font-weight: 700; padding: 0.125rem 0.4375rem;
  }
  .end-btn:hover { background: #ff5a64; color: #fff; }

  /* 고정 후원 영역 */
  #pins { flex-shrink: 0; padding: 0 0.5rem; }
  .donation {
    margin-top: 0.5rem; border-radius: 0.5rem; overflow: hidden;
    background: linear-gradient(180deg, var(--donate1), var(--donate2));
    animation: pop .35s ease-out;
  }
  .donation .msg { padding: 0.5625rem 0.75rem 0.25rem; font-weight: 700; font-size: 0.875rem; }
  .donation .msg .t { color: #b9b0d8; font-weight: 400; margin-right: 0.25rem; }
  .donation .meta {
    display: flex; align-items: center; padding: 0.25rem 0.75rem 0.5625rem; font-size: 0.75rem; color: #c9c2e6;
  }
  .donation .amt {
    margin-left: auto; background: #12101c; color: #fff; font-weight: 900;
    padding: 0.1875rem 0.625rem; border-radius: 0.75rem; font-size: 0.8125rem;
  }
  .donation.fade { opacity: .55; }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }

  /* 채팅 로그 */
  #chat {
    flex: 1; overflow-y: auto; padding: 0.5rem 0.75rem; overflow-anchor: none;
    font-size: 0.9375rem; line-height: 1.75;
    scrollbar-width: thin; scrollbar-color: #33363c transparent;
  }
  .line { word-break: break-all; }
  .line .t { color: var(--muted); margin-right: 0.375rem; font-variant-numeric: tabular-nums; }
  .line .badge { margin-right: 0.25rem; }
  .line .nick { font-weight: 700; margin-right: 0.5rem; }
  .line.hype .body { font-weight: 700; }

  /* 하단 버튼 */
  footer {
    flex-shrink: 0; padding: 0.625rem; gap: 0.5rem;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--panel); border-top: 1px solid var(--line);
  }
  .hype-btn {
    position: relative; overflow: hidden;
    border: none; border-radius: 0.625rem; cursor: pointer;
    padding: 0.875rem 0.25rem; font: inherit; font-size: 1.125rem; font-weight: 900; color: #0d0d0f;
    transition: transform .08s;
  }
  .hype-btn:active { transform: scale(.95); }
  .hype-btn .key {
    position: absolute; top: 0.25rem; left: 0.4375rem; font-size: 0.625rem; font-weight: 700; opacity: .55;
  }
  .hype-btn .bar {
    position: absolute; left: 0; bottom: 0; height: 0.25rem; width: 0; background: rgba(0,0,0,.35);
  }
  .hype-btn:nth-child(1) { background: #00ffa3; }
  .hype-btn:nth-child(2) { background: #ffd23f; }
  .hype-btn:nth-child(3) { background: #7ab8ff; }
  .hype-btn:nth-child(4) { background: #ff7b8a; }

  /* 설정 */
  #settings, #result {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; padding: 1rem;
  }
  #settings.open, #result.open { display: flex; }

  /* 방송 결과 */
  .result-card { text-align: center; }
  .result-card .grade-label { font-size: 0.75rem; color: var(--muted); }
  .result-card .grade { font-size: 1.375rem; font-weight: 900; color: var(--accent); margin: 0.25rem 0 1rem; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; text-align: left; }
  .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.625rem 0.75rem; }
  .stat .k { font-size: 0.6875rem; color: var(--muted); }
  .stat .v { font-size: 1.0625rem; font-weight: 900; margin-top: 0.125rem; word-break: keep-all; }
  .stat.wide { grid-column: 1 / -1; }
  .presses { display: flex; gap: 0.375rem; margin-top: 0.375rem; }
  .presses span { flex: 1; text-align: center; border-radius: 0.375rem; padding: 0.25rem 0; font-size: 0.75rem; font-weight: 700; color: #0d0d0f; }
  .sheet {
    background: var(--panel); border: 1px solid var(--line); border-radius: 0.75rem;
    width: 100%; max-width: 26.25rem; max-height: 100%; overflow-y: auto; padding: 1.125rem;
    user-select: text;
  }
  .sheet h2 { font-size: 1.0625rem; margin-bottom: 0.875rem; }
  .sheet label { display: block; font-size: 0.75rem; color: var(--muted); margin: 0.75rem 0 0.3125rem; }
  .sheet input[type=text], .sheet input[type=password], .sheet textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 0.375rem; padding: 0.5rem; font: inherit; font-size: 0.875rem;
  }
  .sheet textarea { height: 6.875rem; resize: vertical; }
  .sheet .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.375rem; }
  .sheet .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.375rem; }
  .sheet input[type=range] { width: 100%; accent-color: var(--accent); }
  .sheet .hint { font-size: 0.6875rem; color: var(--muted); margin-top: 0.25rem; }
  .sheet h3 {
    font-size: 0.8125rem; color: var(--accent); margin: 1.125rem 0 0.125rem; padding-top: 0.75rem;
    border-top: 1px solid var(--line);
  }
  .sheet h2 + h3 { border-top: none; padding-top: 0; margin-top: 0; }
  .sheet select {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 0.375rem; padding: 0.5rem; font: inherit; font-size: 0.875rem;
  }
  .sheet .warn { color: #ff8a92; white-space: pre-line; }
  .sheet .warn:empty { display: none; }
  .sheet .hotkey.risky { border-color: #ffb347; }
  .sheet .hotkey { text-align: center; cursor: pointer; caret-color: transparent; }
  .sheet .hotkey.listening { border-color: var(--accent); color: var(--accent); }
  .sheet .hotkey.bad { border-color: #ff5a64; }
  .desktop-only-inline { display: none; }
  .desktop .desktop-only-inline { display: inline; }
  .desktop .web-only { display: none; }
  .sheet label.check { display: flex; align-items: center; gap: 0.5rem; color: var(--text); font-size: 0.875rem; cursor: pointer; }
  .sheet label.check input { accent-color: var(--accent); width: 1rem; height: 1rem; }
  .key-row { display: flex; gap: 0.375rem; align-items: center; }
  .key-row input { flex: 1; min-width: 0; }
  .key-row button {
    flex-shrink: 0; padding: 0.5rem 0.875rem; border-radius: 0.375rem; border: none; cursor: pointer;
    background: var(--line); color: var(--text); font: inherit; font-size: 0.8125rem; font-weight: 700;
  }
  .sheet .actions {
    display: flex; gap: 0.5rem; margin-top: 1.125rem;
    position: sticky; bottom: -1.125rem; padding: 0.75rem 0 1.125rem; background: var(--panel);
  }
  .sheet .actions button {
    flex: 1; padding: 0.625rem; border-radius: 0.5rem; border: none; cursor: pointer;
    font: inherit; font-weight: 700;
  }
  .btn-save { background: var(--accent); color: #0d0d0f; }
  .btn-reset { background: var(--line); color: var(--text); }
</style>
</head>
<body>

<div id="away">
  <p>채팅창이 작은 창으로 떠 있어요.</p>
  <button type="button" id="pipBack">이 창으로 다시 가져오기</button>
</div>

<div id="app">
<header>
  <span class="live">LIVE</span>
  <span class="title">FakeChat</span>
  <span class="viewers" id="viewers">0</span>
  <button class="icon-btn" id="pin" title="항상 위에 표시">📌</button>
  <button class="icon-btn" id="openSettings" title="설정">⚙</button>
  <button class="end-btn" id="endStream" title="방송 결과 보기">종료</button>
</header>

<div id="pins"></div>
<div id="chat"></div>

<footer id="buttons"></footer>

<div id="settings">
  <div class="sheet">
    <h2>설정</h2>

    <h3>버튼</h3>
    <label>도배할 단어 (마지막 버튼은 망했을 때: 놀리는 채팅이 쏟아져요)</label>
    <div class="row4">
      <input type="text" id="w0"><input type="text" id="w1"><input type="text" id="w2"><input type="text" id="w3">
    </div>

    <div class="hotkey-row">
      <label>버튼별 단축키 <span class="desktop-only-inline">(게임 중에도 동작)</span><span class="web-only">(이 채팅창이 선택돼 있을 때 동작)</span> · 칸을 누르고 원하는 키를 누르세요</label>
      <div class="row4">
        <input type="text" class="hotkey" id="k0" readonly placeholder="없음"><input type="text" class="hotkey" id="k1" readonly placeholder="없음"><input type="text" class="hotkey" id="k2" readonly placeholder="없음"><input type="text" class="hotkey" id="k3" readonly placeholder="없음">
      </div>
      <p class="hint">Ctrl · Alt · Shift 조합 가능 (예: Ctrl+Shift+1). Esc나 Backspace로 비우기.</p>
      <p class="hint warn" id="hotkeyWarn"></p>
    </div>

    <h3>채팅</h3>
    <label>내 닉네임 (채팅이 이름을 불러줘요, 비우면 안 불러요)</label>
    <input type="text" id="name" placeholder="예: 감자왕" maxlength="20">

    <label>게임 종류</label>
    <select id="game"></select>

    <label>방송 시작 인사 (켜고 처음 30초 동안, 버튼을 누르면 바로 끝, 한 줄에 하나씩)</label>
    <textarea id="idleText"></textarea>

    <label>게임 중 채팅 (그 이후, 게임 종류를 고르면 채워져요)</label>
    <textarea id="playText"></textarea>

    <label>평소 채팅 속도 <span id="idleSpeedVal"></span></label>
    <input type="range" id="idleSpeed" min="1" max="10">

    <label>도배 지속 시간 <span id="floodSecVal"></span></label>
    <input type="range" id="floodSec" min="2" max="10">

    <label>후원 확률 (도배 후) <span id="donateVal"></span></label>
    <input type="range" id="donate" min="0" max="100" step="5">

    <label>조용하면 반응 (버튼을 한동안 안 누르면 '방장 졸려?' 같은 채팅)</label>
    <select id="quietMin">
      <option value="0">끄기</option><option value="1">1분 뒤</option><option value="2">2분 뒤</option>
      <option value="3">3분 뒤</option><option value="5">5분 뒤</option>
    </select>

    <h3>효과음</h3>
    <label class="check"><input type="checkbox" id="soundOn"> 후원 알림 소리</label>
    <label>음량 <span id="volumeVal"></span></label>
    <div class="key-row">
      <input type="range" id="volume" min="5" max="100" step="5">
      <button type="button" id="soundTest">미리 듣기</button>
    </div>
    <label class="check" style="margin-top:0.875rem"><input type="checkbox" id="ttsOn"> 후원 메시지 읽어주기 (음성)</label>
    <div class="key-row" style="margin-top:0.375rem">
      <p class="hint" style="flex:1;margin:0">컴퓨터에 깔린 한국어 음성으로 읽어요. 무료예요.</p>
      <button type="button" id="ttsTest">미리 듣기</button>
    </div>


    <div class="actions">
      <button class="btn-reset" id="resetSettings">기본값</button>
      <button class="btn-reset" id="closeSettings">닫기</button>
      <button class="btn-save" id="saveSettings">저장</button>
    </div>
  </div>
</div>
<div id="result">
  <div class="sheet result-card">
    <h2>오늘 방송 결과</h2>
    <p class="grade-label">오늘의 방송</p>
    <p class="grade" id="rGrade"></p>
    <div class="stats">
      <div class="stat"><p class="k">방송 시간</p><p class="v" id="rTime"></p></div>
      <div class="stat"><p class="k">최고 시청자</p><p class="v" id="rPeak"></p></div>
      <div class="stat"><p class="k">받은 후원</p><p class="v" id="rMoney"></p></div>
      <div class="stat"><p class="k">채팅 수</p><p class="v" id="rLines"></p></div>
      <div class="stat wide"><p class="k">버튼 누른 횟수 · 가장 많이 누른 버튼 <b id="rTop"></b></p><div class="presses" id="rPresses"></div></div>
    </div>
    <div class="actions">
      <button class="btn-reset" id="resultClose">계속 방송하기</button>
      <button class="btn-save" id="resultRestart">새 방송 시작</button>
    </div>
  </div>
</div>
</div><!-- #app -->

<script>

const NAME_QUIET = ["{n} 자냐?", "{n} 뭐해", "{n} 일어나 ㅋㅋ", "{n} 살아있냐"];

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem("fakechat-cfg"));
    if (saved) {
      // 버튼이 3개이던 때 저장한 설정이면 새 버튼 칸을 기본값으로 채운다 (이미 쓰는 단축키는 비워둠)
      const c = { ...DEFAULTS, ...saved };
      c.words = DEFAULTS.words.map((w, i) => (saved.words && saved.words[i]) || w);
      c.hotkeys = DEFAULTS.hotkeys.map((k, i) => {
        if (saved.hotkeys && i < saved.hotkeys.length) return saved.hotkeys[i];
        return saved.hotkeys && saved.hotkeys.includes(k) ? "" : k;
      });
      return c;
    }
  } catch (e) {}
  return { ...DEFAULTS };
}
function save() {
  try { localStorage.setItem("fakechat-cfg", JSON.stringify(cfg)); } catch (e) {}

              "곰돌이", "수달", "참치", "만두", "호랑이", "다람쥐", "오리", "여우", "까마귀", "선인장"];

let stats;

  stats = { start: Date.now(), peak: 0, money: 0, donations: 0, lines: 0, presses: [0, 0, 0, 0] };
}
resetStats();

// ---------- 채팅 출력 ----------
const chat = document.getElementById("chat");
const MAX_LINES = 200;

function timeStr() {
  const d = new Date();
  return `[${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}]`;
}

// 맨 아래에 붙어 있는지는 위치를 매번 재지 않고 상태로 기억한다.
// (후원 알림이 뜨면 채팅 칸이 줄어들어 "맨 아래가 아님"으로 잘못 판단하던 문제)
// 사용자가 직접 위로 스크롤할 때만 풀리고, 버튼·단축키·화면 클릭 때 다시 붙는다
let stick = true;
function toBottom() { stick = true; chat.scrollTop = chat.scrollHeight; }
// 프로그램이 내린 스크롤은 무시하고, 휠·터치·스크롤바 드래그 직후의 스크롤만 사용자 조작으로 본다
let userScrollAt = 0, pressing = false;
const markUser = () => { userScrollAt = performance.now(); };
chat.addEventListener("wheel", markUser, { passive: true });
chat.addEventListener("touchstart", markUser, { passive: true });
chat.addEventListener("pointerdown", () => { pressing = true; markUser(); });
window.addEventListener("pointerup", () => { pressing = false; });
chat.addEventListener("scroll", () => {
  if (!pressing && performance.now() - userScrollAt > 800) return;
  stick = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 40;
});
// 채팅 칸 크기가 바뀌면(후원 알림, 창 크기 조절) 맨 아래 유지
new ResizeObserver(() => { if (stick) chat.scrollTop = chat.scrollHeight; }).observe(chat);
// 화면 어디든 누르면 최신 채팅으로 (스크롤바를 누른 경우와 설정·결과 창 안은 제외)
document.getElementById("app").addEventListener("click", e => {
  if (e.target.closest(".sheet")) return;
  if (e.target === chat && e.offsetX >= chat.clientWidth) return;
  toBottom();
});

function addLine(text, hype = false) {
  const v = pick(viewers);
  const el = document.createElement("div");
  el.className = "line" + (hype ? " hype" : "");
  el.innerHTML = `<span class="t"></span>${v.badge ? `<span class="badge">${v.badge}</span>` : ""}<span class="nick"></span><span class="body"></span>`;
  el.querySelector(".t").textContent = timeStr();
  el.querySelector(".nick").textContent = v.nick;
  el.querySelector(".nick").style.color = v.color;
  el.querySelector(".body").textContent = text;
  chat.appendChild(el);
  stats.lines++;
  while (chat.children.length > MAX_LINES) chat.firstChild.remove();
  if (stick) chat.scrollTop = chat.scrollHeight;
}

// ---------- 평소 채팅 ----------
// 켜고 30초만 인사, 그 뒤엔 게임 얘기만 (버튼을 누르면 인사는 바로 끝)
const startedAt = performance.now();
let greetUntil = startedAt + GREET_MS;
let lastHypeAt = 0;
const withName = t => t.replaceAll("{n}", cfg.name);

function idleText() {
  const now = performance.now();
  const greeting = now < greetUntil;
  const named = cfg.name && Math.random() < 0.12;
  // 인사 구간이 끝난 뒤부터 마지막 버튼 이후 시간을 잰다
  const quietFor = now - Math.max(lastHypeAt, greetUntil);
  if (cfg.quietMin && quietFor > cfg.quietMin * 60000 && Math.random() < 0.25) {
    return named ? withName(pick(NAME_QUIET)) : pick(QUIET);
  }
  if (named) return withName(pick(greeting ? NAME_GREET : NAME_PLAY));
  return pick(greeting && Math.random() < 0.85 ? cfg.idle : cfg.playLines);
}

let idleTimer;
function idleLoop() {
  if (!flooding) addLine(idleText());
  // 속도 1 → 약 2.5초, 10 → 약 0.25초 간격
  const base = 2800 / cfg.idleSpeed;
  idleTimer = setTimeout(idleLoop, rand(base * 0.3, base * 1.7));
}

// ---------- 도배 ----------
function variant(word) {
  const last = word.slice(-1);
  const r = Math.random();
  if (r < 0.22) return word;
  if (r < 0.40) return word + last.repeat(Math.floor(rand(1, 5)));
  if (r < 0.55) return word + "~".repeat(Math.floor(rand(1, 4)));
  if (r < 0.68) return word + "!".repeat(Math.floor(rand(1, 4)));
  if (r < 0.80) return word + " " + "ㅋ".repeat(Math.floor(rand(2, 8)));
  if (r < 0.90) return (word + " ").repeat(Math.floor(rand(2, 4))).trim();
  if (cfg.name && Math.random() < 0.5) return withName(pick(NAME_HYPE));
  const extra = ["미쳤다", "지린다", "ㄷㄷ", "실화냐", "개잘하네", "크랙이다", "와", "폼 미쳤다"];
  return word + " " + pick(extra.concat((PRESETS[cfg.game] || PRESETS.general).hype));
}

let flooding = false;
let floodEnd = 0;
let floodWord = "";
const DONATE_MSG = ["방금 플레이 미쳤다", "이건 못 참지", "클립 땄다", "보는 맛이 있네", "오늘 폼 뭐임",
                    "이거 보려고 방송 봄", "와 소름 돋았다", "밥값 드립니다"];

// 망했을 때: 단어 변형 대신 놀리는 채팅과 ㅋㅋㅋ
function roast() {
  const r = Math.random();
  if (r < 0.35) return "ㅋ".repeat(Math.floor(rand(4, 15)));
  if (r < 0.75) return pick(ROAST.concat((PRESETS[cfg.game] || PRESETS.general).fail));
  if (r < 0.87 && cfg.name) return withName(pick(NAME_ROAST));
  return floodWord + " " + "ㅋ".repeat(Math.floor(rand(2, 8)));
}

let floodIdx = 0;
function flood(idx) {
  floodIdx = idx;
  floodWord = cfg.words[idx];
  stats.presses[idx]++;
  toBottom();
  lastHypeAt = performance.now();
  greetUntil = Math.min(greetUntil, lastHypeAt);
  const wasFlooding = flooding;
  flooding = true;
  floodEnd = performance.now() + cfg.floodSec * 1000;
  bumpViewers(rand(20, 120));
  startBar(idx);
  if (!wasFlooding) floodTick();
}

function floodTick() {
  const now = performance.now();
  if (now >= floodEnd) {
    flooding = false;
    // 망했을 땐 후원이 덜 오고, 오면 위로금
    const chance = floodIdx === FAIL ? cfg.donate / 2 : cfg.donate;
    if (Math.random() * 100 < chance) setTimeout(() => donate(floodIdx === FAIL), rand(600, 2000));
    return;
  }
  // 앞부분은 빠르게, 끝으로 갈수록 느려짐
  const remain = (floodEnd - now) / (cfg.floodSec * 1000);
  const burst = remain > 0.6 ? 3 : remain > 0.3 ? 2 : 1;
  for (let i = 0; i < burst; i++) addLine(floodIdx === FAIL ? roast() : variant(floodWord), true);
  setTimeout(floodTick, rand(40, 110) + (1 - remain) * 120);
}

// ---------- 효과음 ----------
// 파일 없이 브라우저 오디오로 "띠링" 두 음을 만든다
let audioCtx = null;
function chime(volume) {
  try {
    audioCtx = audioCtx || new AudioContext();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t0 = audioCtx.currentTime;
    const master = audioCtx.createGain();
    master.gain.value = (volume / 100) * 0.35;
    master.connect(audioCtx.destination);
    [[1046.5, 0], [1568, 0.13]].forEach(([freq, delay]) => {
      [["sine", 1], ["triangle", 0.25]].forEach(([type, level]) => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = type === "sine" ? freq : freq * 2;
        g.gain.setValueAtTime(0, t0 + delay);
        g.gain.linearRampToValueAtTime(level, t0 + delay + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + delay + 0.9);
        osc.connect(g).connect(master);
        osc.start(t0 + delay);
        osc.stop(t0 + delay + 1);
      });
    });
  } catch (e) {}
}

// ---------- 후원 읽어주기 (브라우저 내장 음성, 무료) ----------
function speak(text, volume) {
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ko-KR";
  const voice = speechSynthesis.getVoices().find(v => v.lang.replace("_", "-").startsWith("ko"));
  if (voice) u.voice = voice;
  u.volume = volume / 100;
  u.rate = 1.1;
  speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) speechSynthesis.getVoices(); // 목록을 미리 불러둔다

// ---------- 후원 ----------
const pins = document.getElementById("pins");
function donate(comfort = false) {
  const v = pick(viewers);
  const amount = pick([1000, 1000, 1000, 2000, 3000, 5000, 10000]);
  const el = document.createElement("div");
  el.className = "donation";
  el.innerHTML = `<div class="msg"><span class="t"></span><span class="txt"></span></div>
    <div class="meta"><span class="who"></span><span class="amt"></span></div>`;
  el.querySelector(".t").textContent = timeStr();
  const msg = comfort ? pick(COMFORT_MSG)
    : cfg.name && Math.random() < 0.5 ? withName(pick(NAME_DONATE)) : pick(DONATE_MSG);
  el.querySelector(".txt").textContent = msg;
  el.querySelector(".who").textContent = "💜 " + v.nick;
  el.querySelector(".amt").textContent = "💰 " + amount.toLocaleString();
  pins.prepend(el);
  stats.money += amount;
  stats.donations++;
  if (cfg.soundOn) chime(cfg.volume);
  // 띠링 소리가 끝날 즈음 읽기 시작
  if (cfg.ttsOn) setTimeout(() => speak(`${v.nick}님 ${amount}원 후원. ${msg}`, cfg.volume), cfg.soundOn ? 900 : 0);
  [...pins.children].forEach((c, i) => {
    c.classList.toggle("fade", i > 0);
    if (i > 2) c.remove();
  });
  // 알림이 생기거나 사라지면 채팅 칸 높이가 바뀌므로 바로 맨 아래로 다시 맞춘다
  if (stick) chat.scrollTop = chat.scrollHeight;
  setTimeout(() => { el.remove(); if (stick) chat.scrollTop = chat.scrollHeight; }, 30000);
}

// ---------- 시청자 수 ----------
const viewersEl = document.getElementById("viewers");
let viewerCount = Math.floor(rand(800, 1500));
function bumpViewers(n) { viewerCount += Math.floor(n); renderViewers(); }
function renderViewers() {
  viewersEl.textContent = viewerCount.toLocaleString();
  stats.peak = Math.max(stats.peak, viewerCount);
}
setInterval(() => {
  viewerCount = Math.max(300, viewerCount + Math.floor(rand(-15, 18)));

renderViewers();

// ---------- 버튼 ----------
const buttonsEl = document.getElementById("buttons");
let barAnim = null;
function renderButtons() {
  buttonsEl.innerHTML = "";
  cfg.words.forEach((w, i) => {
    const b = document.createElement("button");
    b.className = "hype-btn";
    b.innerHTML = `<span class="key"></span><span class="label"></span><span class="bar"></span>`;
    b.querySelector(".key").textContent = cfg.hotkeys[i] || "";
    b.querySelector(".label").textContent = w;
    b.addEventListener("click", () => { flood(i); giveBackFocus(); });
    buttonsEl.appendChild(b);
  });
}
function startBar(idx) {
  const bars = buttonsEl.querySelectorAll(".bar");
  bars.forEach(b => b.style.width = "0");
  cancelAnimationFrame(barAnim);
  const bar = bars[idx];
  const step = () => {
    const remain = Math.max(0, (floodEnd - performance.now()) / (cfg.floodSec * 1000));
    bar.style.width = (remain * 100) + "%";
    if (remain > 0) barAnim = requestAnimationFrame(step);
  };
  step();
}
// 웹 버전 단축키: 이 창(또는 작은 창)이 선택돼 있을 때만 동작. 데스크톱 앱은 전역 단축키를 쓴다
function onKey(e) {
  if (desktop || settings.classList.contains("open") || $("result").classList.contains("open")) return;
  const n = cfg.hotkeys.indexOf(toAccelerator(e));
  if (n < 0) return;
  e.preventDefault();
  flood(n);
}
document.addEventListener("keydown", onKey);

// ---------- 설정 창 ----------
// 채팅창이 작은 창(PiP)으로 옮겨가도 찾을 수 있게 document 대신 #app 안에서 찾는다
const appEl = document.getElementById("app");
const $ = id => appEl.querySelector("#" + id) || document.getElementById(id);
const settings = $("settings");
function fillSettings(c) {
  c.words.forEach((w, i) => $("w" + i).value = w);

Object.entries(PRESETS).forEach(([id, p]) => $("game").add(new Option(p.name, id)));
$("game").addEventListener("change", () => {

["idleSpeed", "floodSec", "donate", "volume"].forEach(id => $(id).addEventListener("input", updateLabels));

function closeSettings() {
  settings.classList.remove("open");
  giveBackFocus();
  applyHotkeys();
}
$("openSettings").addEventListener("click", () => {
  fillSettings(cfg);
  settings.classList.add("open");
  if (desktop) {
    // 단축키를 새로 입력받을 수 있게 설정 중에는 전역 등록을 풀어둔다
    window.fakechat.setHotkeys([]);
  }
});
settings.addEventListener("click", e => { if (e.target === settings) closeSettings(); });
$("resetSettings").addEventListener("click", () => fillSettings(DEFAULTS));
// 저장하지 않고 닫기: 바꾼 내용은 버리고, 다음에 열 때 저장된 값으로 다시 채워진다
$("closeSettings").addEventListener("click", closeSettings);
$("saveSettings").addEventListener("click", () => {
  if (!checkHotkeys()) return;
  const lines = id => $(id).value.split("\n").map(s => s.trim()).filter(Boolean);
  const idle = lines("idleText");
  const play = lines("playText");
  const game = $("game").value;
  cfg = {
    words: [0, 1, 2, 3].map(i => $("w" + i).value.trim() || DEFAULTS.words[i]),
    idle: idle.length ? idle : DEFAULTS.idle,
    game,
    playLines: play.length ? play : PRESETS[game].lines,
    idleSpeed: +$("idleSpeed").value,
    floodSec: +$("floodSec").value,
    donate: +$("donate").value,
    name: $("name").value.trim(),
    quietMin: +$("quietMin").value,
    soundOn: $("soundOn").checked,
    ttsOn: $("ttsOn").checked,
    volume: +$("volume").value,
    hotkeys: [0, 1, 2, 3].map(i => $("k" + i).value),
    onTop: cfg.onTop,
  };
  save();
  renderButtons();
  closeSettings();
});

// ---------- 전역 단축키 (데스크톱 전용) ----------
const CODE_KEYS = {
  Space: "Space", Tab: "Tab", Insert: "Insert", Delete: "Delete", Home: "Home", End: "End",
  PageUp: "PageUp", PageDown: "PageDown", ArrowUp: "Up", ArrowDown: "Down",
  ArrowLeft: "Left", ArrowRight: "Right", Minus: "-", Equal: "=", BracketLeft: "[",
  BracketRight: "]", Semicolon: ";", Quote: "'", Comma: ",", Period: ".", Slash: "/",
  Backquote: "`", Backslash: "\\", Pause: "Pause", ScrollLock: "Scrolllock",
};
function toAccelerator(e) {
  const c = e.code;
  let key = null;
  if (/^Key[A-Z]$/.test(c)) key = c.slice(3);
  else if (/^Digit\d$/.test(c)) key = c.slice(5);
  else if (/^F\d{1,2}$/.test(c)) key = c;
  else if (/^Numpad\d$/.test(c)) key = "num" + c.slice(6);
  else if (CODE_KEYS[c]) key = CODE_KEYS[c];
  if (!key) return null;
  const mods = [];
  if (e.ctrlKey) mods.push("Ctrl");
  if (e.altKey) mods.push("Alt");
  if (e.shiftKey) mods.push("Shift");
  return [...mods, key].join("+");
}

document.querySelectorAll(".hotkey").forEach(input => {
  input.addEventListener("focus", () => input.classList.add("listening"));
  input.addEventListener("blur", () => input.classList.remove("listening"));
  input.addEventListener("keydown", e => {
    e.preventDefault();
    e.stopPropagation();
    if (e.key === "Escape" || e.key === "Backspace") { input.value = ""; input.blur(); checkHotkeys(); return; }
    const acc = toAccelerator(e);
    if (!acc) return;
    input.value = acc;
    input.blur();
    checkHotkeys();
  });
});

// 조합키 없이 누르는 글자·숫자·스페이스 등은 게임 조작키(QWER, 1~7, WASD…)와 겹치기 쉽다
function isRisky(acc) {
  return !/Ctrl|Alt|Shift/.test(acc) && /^([A-Z0-9]|num\d|Space|Tab|[-=\[\];',./`\\])$/.test(acc);
}
// 겹치는 단축키가 있으면 false (저장 막음), 게임 키와 겹칠 위험은 경고만
function checkHotkeys() {
  const keys = [0, 1, 2, 3].map(i => $("k" + i).value);
  const msgs = [];
  let ok = true;
  keys.forEach((k, i) => {
    const dup = k && keys.indexOf(k) !== i;
    // 게임 키와 겹칠 걱정은 게임 중에도 키를 가로채는 데스크톱 앱에서만
    const risky = desktop && k && isRisky(k);
    $("k" + i).classList.toggle("bad", !!dup);
    $("k" + i).classList.toggle("risky", !!risky && !dup);
    if (dup) ok = false;
    if (risky) msgs.push(`⚠ ${k}: 게임 조작키와 겹칠 수 있어요. 누르면 게임엔 안 들어가요. Ctrl·Alt·Shift 조합이나 F키를 추천해요.`);
  });
  if (!ok) msgs.unshift("✖ 같은 단축키를 두 버튼에 쓸 수 없어요.");
  $("hotkeyWarn").textContent = [...new Set(msgs)].join("\n");
  return ok;
}

async function applyHotkeys() {
  if (!desktop) return;
  const ok = await window.fakechat.setHotkeys(cfg.hotkeys);
  const failed = cfg.hotkeys.filter((k, i) => k && !ok[i]);
  if (failed.length) addSystemLine(`단축키 등록 실패: ${failed.join(", ")} (다른 프로그램이 쓰는 중일 수 있어요)`);
}

function addSystemLine(text) {
  const el = document.createElement("div");
  el.className = "line";
  el.style.color = "#ff8a92";
  el.textContent = "⚠ " + text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

if (desktop) {
  window.fakechat.onHype(i => { if (!settings.classList.contains("open") && !$("result").classList.contains("open")) flood(i); });
  const pin = $("pin");
  const setPin = async on => {
    cfg.onTop = await window.fakechat.setOnTop(on);
    pin.classList.toggle("on", cfg.onTop);
    save();
  };
  pin.addEventListener("click", () => { setPin(!cfg.onTop); giveBackFocus(); });
  setPin(cfg.onTop);
  applyHotkeys();
}

// ---------- 항상 위 작은 창 (웹, 크롬·엣지 전용) ----------
// Document Picture-in-Picture: 다른 창 위에 늘 떠 있는 작은 창으로 채팅창 전체를 옮긴다
let pipWin = null;
async function openPip() {
  pipWin = await documentPictureInPicture.requestWindow({ width: 360, height: 640 });
  const pd = pipWin.document;
  pd.title = "FakeChat";
  document.head.querySelectorAll("style, link[rel=stylesheet]").forEach(n => pd.head.appendChild(n.cloneNode(true)));
  pd.body.className = document.body.className;
  pd.body.append(appEl);
  $("pin").classList.add("on");
  $("away").classList.add("show");
  pipWin.addEventListener("keydown", onKey);
  pipWin.addEventListener("pagehide", () => {
    document.body.insertBefore(appEl, document.querySelector("script"));
    $("pin").classList.remove("on");
    $("away").classList.remove("show");
    chat.scrollTop = chat.scrollHeight;
    pipWin = null;
  });
  chat.scrollTop = chat.scrollHeight;
}
if (!desktop && "documentPictureInPicture" in window) {
  document.body.classList.add("can-pip");
  $("pin").title = "항상 위 작은 창으로 띄우기";
  $("pin").addEventListener("click", () => {
    if (pipWin) return pipWin.close();
    openPip().catch(() => addSystemLine("이 브라우저에서는 작은 창을 열 수 없어요. 최신 크롬이나 엣지에서 열어주세요."));
  });
  $("pipBack").addEventListener("click", () => pipWin && pipWin.close());
}

// ---------- 방송 결과 ----------
const BTN_COLORS = ["#00ffa3", "#ffd23f", "#7ab8ff", "#ff7b8a"];
function gradeOf() {
  const hype = stats.presses.slice(0, FAIL).reduce((a, b) => a + b, 0);
  const fails = stats.presses[FAIL];
  if (hype + fails === 0) return "조용한 힐링 방송";
  if (fails > hype) return "멘탈 수련 방송";
  const score = hype + stats.money / 2000;
  if (score >= 60) return "전설의 방송";
  if (score >= 30) return "도파민 폭발 방송";
  if (score >= 10) return "분위기 좋은 방송";
  return "몸 푸는 방송";
}
function showResult() {
  const min = Math.floor((Date.now() - stats.start) / 60000);
  $("rGrade").textContent = gradeOf();
  $("rTime").textContent = min >= 60 ? `${Math.floor(min / 60)}시간 ${min % 60}분` : `${min}분`;
  $("rPeak").textContent = stats.peak.toLocaleString() + "명";
  $("rMoney").textContent = `${stats.money.toLocaleString()}원 (${stats.donations}건)`;
  $("rLines").textContent = stats.lines.toLocaleString() + "줄";
  const max = Math.max(...stats.presses);
  $("rTop").textContent = max ? `"${cfg.words[stats.presses.indexOf(max)]}"` : "";
  const box = $("rPresses");
  box.innerHTML = "";
  cfg.words.forEach((w, i) => {
    const sp = document.createElement("span");
    sp.style.background = BTN_COLORS[i];
    sp.textContent = `${w} ${stats.presses[i]}`;
    box.appendChild(sp);
  });
  $("result").classList.add("open");
}
function startStream() {
  resetStats();
  chat.innerHTML = "";
  pins.innerHTML = "";
  flooding = false;
  floodEnd = 0;
  lastHypeAt = 0;
  greetUntil = performance.now() + GREET_MS;
  viewerCount = Math.floor(rand(800, 1500));
  renderViewers();
  for (let i = 0; i < 12; i++) addLine(pick(cfg.idle));
}
$("endStream").addEventListener("click", () => { showResult(); giveBackFocus(); });
$("resultClose").addEventListener("click", () => { $("result").classList.remove("open"); giveBackFocus(); });
$("resultRestart").addEventListener("click", () => { $("result").classList.remove("open"); startStream(); giveBackFocus(); });
$("result").addEventListener("click", e => { if (e.target === $("result")) $("result").classList.remove("open"); });

// ---------- 시작 ----------
renderButtons();
startStream();
idleLoop();
</script>
